<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Term | Science MATATAG Hub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <a href="../index.html" class="logo-container">
            <svg width="50" height="50" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M85,50 A35,35 0 1,1 70,20" fill="none" stroke="#2D5A27" stroke-width="6" stroke-linecap="round"/>
                <line x1="75" y1="75" x2="95" y2="95" stroke="#2D5A27" stroke-width="6" stroke-linecap="round"/>
                <path d="M35,30 V60 Q35,70 25,70" fill="none" stroke="#2C3333" stroke-width="5" stroke-linecap="round"/>
                <path d="M45,30 Q65,30 65,45 Q65,55 45,55 Q65,55 65,70 Q65,80 45,80" fill="none" stroke="#2D5A27" stroke-width="5" stroke-linecap="round"/>
                <line x1="45" y1="30" x2="45" y2="80" stroke="#2C3333" stroke-width="5" stroke-linecap="round"/>
                <circle cx="65" cy="45" r="3" fill="#2D5A27"/>
                <circle cx="65" cy="70" r="3" fill="#2D5A27"/>
                <circle cx="35" cy="30" r="3" fill="#2C3333"/>
            </svg>
            <h2>Science MATATAG Hub</h2>
        </a>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../about.html">About</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1 id="gradeTitle" style="text-align: center; margin-bottom: 30px; color: var(--primary);"></h1>
        <div class="grid">
            <a id="term1" class="card"><h3>First Term</h3><p>View Lessons</p></a>
            <a id="term2" class="card"><h3>Second Term</h3><p>View Lessons</p></a>
            <a id="term3" class="card"><h3>Third Term</h3><p>View Lessons</p></a>
        </div>
        <br><br>
        <a href="../index.html" style="color: var(--primary); text-decoration: none;">&larr; Back to Grade Selection</a>
    </div>
    <script>
        const g = new URLSearchParams(window.location.search).get('grade');
        document.getElementById('gradeTitle').innerText = "Grade " + g + " Budget of Work";
        document.getElementById('term1').href = `term.html?grade=${g}&term=1`;
        document.getElementById('term2').href = `term.html?grade=${g}&term=2`;
        document.getElementById('term3').href = `term.html?grade=${g}&term=3`;
    </script>
</body>
</html>
